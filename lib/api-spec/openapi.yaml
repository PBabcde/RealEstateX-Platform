openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RealEstateX property intelligence API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: properties
    description: Property portfolio operations
  - name: valuation
    description: Property valuation calculations
  - name: rental
    description: Rental return calculations
  - name: mortgage
    description: Mortgage scenario calculations
  - name: market
    description: Market trend insights
  - name: dashboard
    description: Portfolio summary insights
  - name: suite
    description: Phase 2 suite registry and system overview
  - name: assistant
    description: AssistantX guidance
  - name: documents
    description: Tenant-scoped document ingestion and retrieval
  - name: chat
    description: ChatBoxX sessions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List saved properties
      responses:
        "200":
          description: Saved properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Add a property to the portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /properties/{propertyId}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a saved property
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a saved property
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Remove a property from the portfolio
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "204":
          description: Property removed
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /valuations/calculate:
    post:
      operationId: calculateValuation
      tags: [valuation]
      summary: Estimate property value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuationInput"
      responses:
        "200":
          description: Valuation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rentals/overview:
    post:
      operationId: calculateRentalOverview
      tags: [rental]
      summary: Calculate annual rental return
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalInput"
      responses:
        "200":
          description: Rental return result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mortgages/calculate:
    post:
      operationId: calculateMortgage
      tags: [mortgage]
      summary: Calculate monthly mortgage payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MortgageInput"
      responses:
        "200":
          description: Mortgage calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MortgageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /market/trends:
    get:
      operationId: getMarketTrends
      tags: [market]
      summary: Get current market trend
      responses:
        "200":
          description: Market trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketTrend"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get portfolio dashboard summary
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /suite/overview:
    get:
      operationId: getSuiteOverview
      tags: [suite]
      summary: Get RealEstateX Phase 2 suite overview
      responses:
        "200":
          description: Connected suite modules and service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuiteOverview"
  /assistant/ask:
    post:
      operationId: askAssistant
      tags: [assistant]
      summary: Ask the real-estate assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /assistant/documents:
    get:
      operationId: listAssistantDocuments
      tags: [documents]
      summary: List indexed documents for the authenticated tenant
      responses:
        "200":
          description: Indexed documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: ingestAssistantDocument
      tags: [documents]
      summary: Validate, index and store a text document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Indexed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /assistant/documents/{documentId}:
    delete:
      operationId: deleteAssistantDocument
      tags: [documents]
      summary: Delete an indexed document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /assistant/retrieve:
    post:
      operationId: retrieveAssistantContext
      tags: [documents]
      summary: Retrieve tenant-scoped passages with source citations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalInput"
      responses:
        "200":
          description: Retrieved passages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /chat/start:
    post:
      operationId: startChat
      tags: [chat]
      summary: Start a ChatBoxX session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatStartInput"
      responses:
        "201":
          description: Chat session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /chat/send:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to ChatBoxX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReplyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /chat/history:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Read ChatBoxX session history
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat session history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the application after login
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
components:
  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      description: Stable property identifier
      schema:
        type: string
        minLength: 1
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token in the form Bearer sid
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user lacks access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Property:
      allOf:
        - $ref: "#/components/schemas/PropertyInput"
        - type: object
          properties:
            propertyId:
              type: string
          required: [propertyId]
    PropertyInput:
      type: object
      properties:
        adres:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        bouwjaar:
          type: integer
          minimum: 1000
          maximum: 2100
        woonoppervlak:
          type: number
          minimum: 1
        perceel:
          type: number
          minimum: 0
        energielabel:
          type: string
          minLength: 1
        kenmerken:
          type: object
          additionalProperties:
            type: string
      required: [adres, type, bouwjaar, woonoppervlak, energielabel]
    PropertyUpdate:
      type: object
      properties:
        adres:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        bouwjaar:
          type: integer
          minimum: 1000
          maximum: 2100
        woonoppervlak:
          type: number
          minimum: 1
        perceel:
          type: number
          minimum: 0
        energielabel:
          type: string
          minLength: 1
        kenmerken:
          type: object
          additionalProperties:
            type: string
    ValuationInput:
      type: object
      properties:
        woonoppervlak:
          type: number
          minimum: 1
        energielabel:
          type: string
        locatieFactor:
          type: number
          minimum: 0
          default: 1
      required: [woonoppervlak]
    ValuationResult:
      type: object
      properties:
        status:
          type: string
        valuation:
          type: number
        pricePerSquareMeter:
          type: number
      required: [status, valuation, pricePerSquareMeter]
    RentalInput:
      type: object
      properties:
        huurprijs:
          type: number
          minimum: 0
        kosten:
          type: number
          minimum: 0
        investering:
          type: number
          minimum: 0
      required: [huurprijs, kosten]
    RentalResult:
      type: object
      properties:
        status:
          type: string
        annualRendement:
          type: number
        grossYield:
          type: number
      required: [status, annualRendement, grossYield]
    MortgageInput:
      type: object
      properties:
        principal:
          type: number
          minimum: 0
        interest:
          type: number
          minimum: 0
        years:
          type: integer
          minimum: 1
          maximum: 50
      required: [principal, interest, years]
    MortgageResult:
      type: object
      properties:
        status:
          type: string
        monthlyPayment:
          type: number
        totalRepayment:
          type: number
      required: [status, monthlyPayment, totalRepayment]
    MarketTrend:
      type: object
      properties:
        status:
          type: string
        trend:
          type: string
        change:
          type: number
        period:
          type: string
      required: [status, trend, change, period]
    DashboardSummary:
      type: object
      properties:
        propertyCount:
          type: integer
        totalArea:
          type: number
        averageValuation:
          type: number
        averageRentalYield:
          type: number
        marketTrend:
          type: string
        lastUpdated:
          type: string
      required:
        - propertyCount
        - totalArea
        - averageValuation
        - averageRentalYield
        - marketTrend
        - lastUpdated
    SuiteModule:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        status:
          type: string
        capability:
          type: string
      required: [name, category, status, capability]
    SuiteOverview:
      type: object
      properties:
        status:
          type: string
        connectedModules:
          type: integer
        activeServices:
          type: integer
        moduleCount:
          type: integer
        modules:
          type: array
          items:
            $ref: "#/components/schemas/SuiteModule"
        lastUpdated:
          type: string
      required:
        - status
        - connectedModules
        - activeServices
        - moduleCount
        - modules
        - lastUpdated
    AssistantInput:
      type: object
      properties:
        question:
          type: string
          minLength: 1
        context:
          type: object
          additionalProperties: true
      required: [question]
    AssistantResponse:
      type: object
      properties:
        status:
          type: string
        module:
          type: string
        intent:
          type: string
        answer:
          type: string
        nextSteps:
          type: array
          items:
            type: string
        contextUsed:
          type: boolean
        ragReady:
          type: boolean
        citations:
          type: array
          items:
            $ref: "#/components/schemas/DocumentCitation"
        missingSources:
          type: boolean
      required:
        [
          status,
          module,
          intent,
          answer,
          nextSteps,
          contextUsed,
          ragReady,
          citations,
          missingSources,
        ]
    DocumentInput:
      type: object
      properties:
        filename:
          type: string
          minLength: 1
          maxLength: 180
        content:
          type: string
          minLength: 1
          maxLength: 250000
        contentType:
          type: string
        documentType:
          type: string
        retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
      required: [filename, content]
    DocumentSummary:
      type: object
      properties:
        documentId:
          type: string
        filename:
          type: string
        documentType:
          type: string
        contentHash:
          type: string
        createdAt:
          type: string
        expiresAt:
          type: string
        chunkCount:
          type: integer
      required:
        [
          documentId,
          filename,
          documentType,
          contentHash,
          createdAt,
          expiresAt,
          chunkCount,
        ]
    DocumentResponse:
      type: object
      properties:
        status:
          type: string
        document:
          $ref: "#/components/schemas/DocumentSummary"
      required: [status, document]
    DocumentListResponse:
      type: object
      properties:
        status:
          type: string
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"
      required: [status, documents]
    DocumentCitation:
      type: object
      properties:
        citationId:
          type: string
        documentId:
          type: string
        chunkId:
          type: string
        filename:
          type: string
        quote:
          type: string
        score:
          type: number
      required: [citationId, documentId, chunkId, filename, quote, score]
    DocumentPassage:
      allOf:
        - $ref: "#/components/schemas/DocumentCitation"
        - type: object
          properties:
            documentType:
              type: string
            text:
              type: string
          required: [documentType, text]
    RetrievalInput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        topK:
          type: integer
          minimum: 1
          maximum: 20
      required: [query]
    RetrievalResponse:
      type: object
      properties:
        status:
          type: string
        passages:
          type: array
          items:
            $ref: "#/components/schemas/DocumentPassage"
        citations:
          type: array
          items:
            $ref: "#/components/schemas/DocumentCitation"
        missingSources:
          type: boolean
      required: [status, passages, citations, missingSources]
    ChatStartInput:
      type: object
    ChatMessageInput:
      type: object
      properties:
        sessionId:
          type: string
        message:
          type: string
          minLength: 1
      required: [sessionId, message]
    ChatMessage:
      type: object
      properties:
        role:
          type: string
        content:
          type: string
        at:
          type: string
      required: [role, content, at]
    ChatSessionResponse:
      type: object
      properties:
        status:
          type: string
        module:
          type: string
        sessionId:
          type: string
      required: [status, module, sessionId]
    ChatReplyResponse:
      type: object
      properties:
        status:
          type: string
        module:
          type: string
        sessionId:
          type: string
        reply:
          $ref: "#/components/schemas/AssistantResponse"
      required: [status, module, sessionId, reply]
    ChatHistoryResponse:
      type: object
      properties:
        status:
          type: string
        module:
          type: string
        sessionId:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required: [status, module, sessionId, messages]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        role:
          type: string
          enum: [owner, admin, member]
      required: [id, email, firstName, lastName, profileImageUrl, role]
    AuthUserEnvelope:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required: [user]
    MobileTokenExchangeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          format: uri
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
      required: [code, code_verifier, redirect_uri, state]
    MobileTokenExchangeSuccess:
      type: object
      properties:
        token:
          type: string
      required: [token]
    LogoutSuccess:
      type: object
      properties:
        success:
          type: boolean
          const: true
      required: [success]
