openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: RealEstateX property intelligence API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: properties
    description: Property portfolio operations
  - name: valuation
    description: Property valuation calculations
  - name: rental
    description: Rental return calculations
  - name: mortgage
    description: Mortgage scenario calculations
  - name: market
    description: Market trend insights
  - name: dashboard
    description: Portfolio summary insights
  - name: suite
    description: Phase 2 suite registry and system overview
  - name: assistant
    description: AssistantX guidance
  - name: documents
    description: Tenant-scoped document ingestion and retrieval
  - name: chat
    description: ChatBoxX sessions
  - name: enterprise
    description: Tenant-scoped Dealing Room, investor, CRM and SaaS operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /properties:
    get:
      operationId: listProperties
      tags: [properties]
      summary: List saved properties
      responses:
        "200":
          description: Saved properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Property"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProperty
      tags: [properties]
      summary: Add a property to the portfolio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "201":
          description: Created property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /properties/{propertyId}:
    get:
      operationId: getProperty
      tags: [properties]
      summary: Get a saved property
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "200":
          description: Property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      operationId: updateProperty
      tags: [properties]
      summary: Update a saved property
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyUpdate"
      responses:
        "200":
          description: Updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      operationId: deleteProperty
      tags: [properties]
      summary: Remove a property from the portfolio
      parameters:
        - $ref: "#/components/parameters/PropertyId"
      responses:
        "204":
          description: Property removed
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /valuations/calculate:
    post:
      operationId: calculateValuation
      tags: [valuation]
      summary: Estimate property value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValuationInput"
      responses:
        "200":
          description: Valuation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValuationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /rentals/overview:
    post:
      operationId: calculateRentalOverview
      tags: [rental]
      summary: Calculate annual rental return
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RentalInput"
      responses:
        "200":
          description: Rental return result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mortgages/calculate:
    post:
      operationId: calculateMortgage
      tags: [mortgage]
      summary: Calculate monthly mortgage payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MortgageInput"
      responses:
        "200":
          description: Mortgage calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MortgageResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /market/trends:
    get:
      operationId: getMarketTrends
      tags: [market]
      summary: Get current market trend
      responses:
        "200":
          description: Market trend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketTrend"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get portfolio dashboard summary
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /suite/overview:
    get:
      operationId: getSuiteOverview
      tags: [suite]
      summary: Get RealEstateX Phase 2 suite overview
      responses:
        "200":
          description: Connected suite modules and service status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuiteOverview"
  /assistant/ask:
    post:
      operationId: askAssistant
      tags: [assistant]
      summary: Ask the real-estate assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantInput"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /assistant/documents:
    get:
      operationId: listAssistantDocuments
      tags: [documents]
      summary: List indexed documents for the authenticated tenant
      responses:
        "200":
          description: Indexed documents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: ingestAssistantDocument
      tags: [documents]
      summary: Validate, index and store a text document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Indexed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /assistant/documents/{documentId}:
    delete:
      operationId: deleteAssistantDocument
      tags: [documents]
      summary: Delete an indexed document
      parameters:
        - name: documentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /assistant/retrieve:
    post:
      operationId: retrieveAssistantContext
      tags: [documents]
      summary: Retrieve tenant-scoped passages with source citations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalInput"
      responses:
        "200":
          description: Retrieved passages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /chat/start:
    post:
      operationId: startChat
      tags: [chat]
      summary: Start a ChatBoxX session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatStartInput"
      responses:
        "201":
          description: Chat session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /chat/send:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message to ChatBoxX
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatReplyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /chat/history:
    get:
      operationId: getChatHistory
      tags: [chat]
      summary: Read ChatBoxX session history
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Chat session history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatHistoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /deals:
    get:
      operationId: listDeals
      tags: [enterprise]
      summary: List tenant-scoped deals
      responses:
        "200":
          description: Deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DealRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createDeal
      tags: [enterprise]
      summary: Create a deal from an accessible property
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealInput"
      responses:
        "201":
          description: Deal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /deals/{dealId}:
    get:
      operationId: getDeal
      tags: [enterprise]
      summary: Get deal detail with energy, subsidy and ROI analysis
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: Deal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDeal
      tags: [enterprise]
      summary: Update a deal
      parameters:
        - $ref: "#/components/parameters/DealId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealInput"
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDeal
      tags: [enterprise]
      summary: Delete a deal
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "204":
          description: Deal deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /deals/{dealId}/score:
    post:
      operationId: scoreDeal
      tags: [enterprise]
      summary: Calculate the five-part deal score
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: Deal score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealScore"
        "404":
          $ref: "#/components/responses/NotFound"
  /deals/{dealId}/energy:
    get:
      operationId: getDealEnergyAnalysis
      tags: [enterprise]
      summary: Calculate energy, subsidy and net ROI analysis
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: Energy and subsidy analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnergyResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /deals/{dealId}/matches:
    get:
      operationId: getDealMatches
      tags: [enterprise]
      summary: Return the top ten investor matches
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: Investor matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvestorMatch"
        "404":
          $ref: "#/components/responses/NotFound"
  /deals/{dealId}/investor-ready-sheet:
    get:
      operationId: downloadInvestorReadySheet
      tags: [enterprise]
      summary: Download an investor-ready PDF sheet
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: Investor-ready PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /deals/{dealId}/sales-intelligence:
    get:
      operationId: getDealSalesIntelligence
      tags: [enterprise]
      summary: Get tenant-scoped deal viewing and high-intent activity
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: Deal sales activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealSalesIntelligence"
        "404":
          $ref: "#/components/responses/NotFound"
  /deals/{dealId}/sentiment/refresh:
    post:
      operationId: refreshDealNeighborhoodSentiment
      tags: [enterprise]
      summary: Analyze recent news for the deal neighborhood and update Gut Feeling
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: Neighborhood sentiment snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborhoodSentimentSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: News source unavailable or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deals/{dealId}/sentiment:
    get:
      operationId: getDealNeighborhoodSentiment
      tags: [enterprise]
      summary: Get the latest tenant-scoped neighborhood sentiment snapshot for a deal
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: Latest neighborhood sentiment snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborhoodSentimentSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
  /deals/{dealId}/media-brief:
    get:
      operationId: getDealMediaBrief
      tags: [enterprise]
      summary: Create provider-neutral before-and-after render and video-loop prompts
      parameters:
        - $ref: "#/components/parameters/DealId"
      responses:
        "200":
          description: Media generation brief; no external render is claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaRenderBrief"
        "404":
          $ref: "#/components/responses/NotFound"
  /training/scenarios:
    get:
      operationId: trainingListScenarios
      tags: [enterprise]
      summary: List tenant-scoped Training Room scenarios
      responses:
        "200":
          description: Training scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrainingScenario"
    post:
      operationId: trainingCreateScenario
      tags: [enterprise]
      summary: Create a Training Room renovation scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingScenarioInput"
      responses:
        "201":
          description: Scenario created and scored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingScenario"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /training/scenarios/{scenarioId}:
    get:
      operationId: trainingGetScenario
      tags: [enterprise]
      summary: Get a tenant-scoped Training Room scenario
      parameters:
        - $ref: "#/components/parameters/TrainingScenarioId"
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingScenario"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: trainingUpdateScenario
      tags: [enterprise]
      summary: Update a draft Training Room scenario
      parameters:
        - $ref: "#/components/parameters/TrainingScenarioId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrainingScenarioUpdate"
      responses:
        "200":
          description: Updated scenario and quality-gate score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingScenario"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /training/scenarios/{scenarioId}/promote:
    post:
      operationId: trainingPromoteScenario
      tags: [enterprise]
      summary: Promote a scenario with score 80 or higher and prepare its investor PDF
      parameters:
        - $ref: "#/components/parameters/TrainingScenarioId"
      responses:
        "200":
          description: Existing or newly promoted deal and its PDF download route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingPromotionResponse"
        "403":
          description: Quality Gate score is below 80
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /training/scenarios/{scenarioId}/investor-ready-sheet:
    get:
      operationId: trainingDownloadInvestorReadySheet
      tags: [enterprise]
      summary: Generate or download the promoted scenario's Investor Ready Sheet PDF
      parameters:
        - $ref: "#/components/parameters/TrainingScenarioId"
      responses:
        "200":
          description: Investor Ready Sheet PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /training/scenarios/{scenarioId}/sentiment/refresh:
    post:
      operationId: trainingRefreshScenarioSentiment
      tags: [enterprise]
      summary: Refresh neighborhood news sentiment and recalculate the scenario score
      parameters:
        - $ref: "#/components/parameters/TrainingScenarioId"
      responses:
        "200":
          description: Updated scenario and news snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrainingSentimentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: News source unavailable or returned invalid data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /visitor-intent/events:
    post:
      operationId: recordVisitorIntentEvent
      tags: [enterprise]
      summary: Record a consented, pseudonymous visitor action
      description: Requires authentication; tenant identity is always taken from the session, never from the request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorIntentEventInput"
      responses:
        "201":
          description: Recorded event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorIntentEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Visitor event rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /visitor-intent/summary:
    get:
      operationId: getVisitorIntentSummary
      tags: [enterprise]
      summary: Get tenant-scoped lead scores and visitor intent activity
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 30
      responses:
        "200":
          description: Lead scoring summary for consented pseudonymous events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorIntentSummary"
  /market-pulse/daily:
    get:
      operationId: getDailyMarketPulse
      tags: [enterprise]
      summary: Get up to three real tenant deals ranked by net ROI and deal score
      responses:
        "200":
          description: Daily Market Pulse; fewer than three items are returned when fewer qualify
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyMarketPulse"
  /investors/{investorId}/recommendations:
    get:
      operationId: getInvestorRecommendations
      tags: [enterprise]
      summary: Get profile-personalized deal recommendations and greeting
      parameters:
        - $ref: "#/components/parameters/InvestorId"
      responses:
        "200":
          description: Recommended deals for the investor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorRecommendations"
        "404":
          $ref: "#/components/responses/NotFound"
  /investors:
    get:
      operationId: listInvestors
      tags: [enterprise]
      summary: List tenant-scoped investors
      responses:
        "200":
          description: Investors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvestorRecord"
    post:
      operationId: createInvestor
      tags: [enterprise]
      summary: Create an investor profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorInput"
      responses:
        "201":
          description: Investor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
  /investors/{investorId}:
    get:
      operationId: getInvestor
      tags: [enterprise]
      summary: Get an investor profile
      parameters:
        - $ref: "#/components/parameters/InvestorId"
      responses:
        "200":
          description: Investor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorRecord"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateInvestor
      tags: [enterprise]
      summary: Update an investor profile
      parameters:
        - $ref: "#/components/parameters/InvestorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestorInput"
      responses:
        "200":
          description: Updated investor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestorRecord"
    delete:
      operationId: deleteInvestor
      tags: [enterprise]
      summary: Delete an investor profile
      parameters:
        - $ref: "#/components/parameters/InvestorId"
      responses:
        "204":
          description: Investor deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /crm/contacts:
    get:
      operationId: listCrmContacts
      tags: [enterprise]
      summary: List tenant-scoped CRM contacts
      responses:
        "200":
          description: CRM contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrmContactRecord"
    post:
      operationId: createCrmContact
      tags: [enterprise]
      summary: Create a CRM contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmContactInput"
      responses:
        "201":
          description: CRM contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmContactRecord"
  /crm/contacts/{contactId}:
    get:
      operationId: getCrmContact
      tags: [enterprise]
      summary: Get a CRM contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: CRM contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmContactRecord"
        "404":
          $ref: "#/components/responses/NotFound"
  /crm/contacts/{contactId}/activities:
    get:
      operationId: listCrmActivities
      tags: [enterprise]
      summary: List communication history for a CRM contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: Communication history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrmActivityRecord"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createCrmActivity
      tags: [enterprise]
      summary: Add a communication activity to a CRM contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmActivityInput"
      responses:
        "201":
          description: Communication activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmActivityRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateCrmContact
      tags: [enterprise]
      summary: Update a CRM contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrmContactInput"
      responses:
        "200":
          description: Updated CRM contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrmContactRecord"
    delete:
      operationId: deleteCrmContact
      tags: [enterprise]
      summary: Delete a CRM contact
      parameters:
        - $ref: "#/components/parameters/ContactId"
      responses:
        "204":
          description: CRM contact deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /enterprise/overview:
    get:
      operationId: getEnterpriseOverview
      tags: [enterprise]
      summary: Get tenant-scoped Enterprise Core overview
      responses:
        "200":
          description: Enterprise overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseOverview"
  /saas/entitlements:
    get:
      operationId: getSaasEntitlements
      tags: [enterprise]
      summary: Get SaaS tier entitlements
      parameters:
        - name: tier
          in: query
          required: false
          schema:
            type: string
            enum: [STARTER, PROFESSIONAL, INVESTOR, ENTERPRISE]
      responses:
        "200":
          description: SaaS entitlements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaasEntitlements"
  /saas/billing/status:
    get:
      operationId: getSaasBillingStatus
      tags: [enterprise]
      summary: Report provider-neutral SaaS billing readiness
      responses:
        "200":
          description: Billing readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingReadiness"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Auth status resolved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the application after login
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the browser session and begin OIDC logout
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC provider logout URL
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
components:
  parameters:
    PropertyId:
      name: propertyId
      in: path
      required: true
      description: Stable property identifier
      schema:
        type: string
        minLength: 1
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token in the form Bearer sid
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie
      schema:
        type: string
    DealId:
      name: dealId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    TrainingScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    InvestorId:
      name: investorId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Authenticated user lacks access
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    DealInput:
      type: object
      required: [propertyId, title, region, askingPrice, expectedValue]
      properties:
        propertyId: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        askingPrice: { type: number, minimum: 1 }
        renovationCost: { type: number, minimum: 0 }
        expectedValue: { type: number, minimum: 1 }
        monthlyRent: { type: number, minimum: 0 }
        municipality: { type: string }
    DealScore:
      type: object
      required: [flitsScore, splitScore, transformationScore, energyScore, subsidyScore, totalScore, decision, margin, grossYield]
      properties:
        flitsScore: { type: number }
        splitScore: { type: number }
        transformationScore: { type: number }
        energyScore: { type: number }
        subsidyScore: { type: number }
        totalScore: { type: number }
        decision: { type: string, enum: [GO, HOLD, REJECT] }
        margin: { type: number }
        grossYield: { type: number }
        gutFeelingScore: { type: ["number", "null"], minimum: 0, maximum: 100 }
        gutFeelingConfidence: { type: number, minimum: 0, maximum: 100 }
        gutFeelingContribution: { type: number }
    DealRecord:
      allOf:
        - $ref: "#/components/schemas/DealInput"
        - type: object
          required: [dealId, propertyType, energyLabel, woonoppervlak, status, ownerId, score, createdAt, updatedAt]
          properties:
            dealId: { type: string }
            propertyType: { type: string }
            energyLabel: { type: string }
            woonoppervlak: { type: number }
            status: { type: string, enum: [DRAFT, REVIEW, GO, HOLD, REJECT] }
            ownerId: { type: string }
            score: { $ref: "#/components/schemas/DealScore" }
            gutFeeling: { $ref: "#/components/schemas/GutFeelingSignal" }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    EnergyMeasure:
      type: object
      required: [name, investment, annualSavings]
      properties:
        name: { type: string }
        investment: { type: number }
        annualSavings: { type: number }
    EnergyAnalysis:
      type: object
      required: [currentLabel, labelScore, annualEnergyCost, annualSavings, paybackYears, revisedValue, measures]
      properties:
        currentLabel: { type: string }
        labelScore: { type: number }
        annualEnergyCost: { type: number }
        annualSavings: { type: number }
        paybackYears: { type: number }
        revisedValue: { type: number }
        measures:
          type: array
          items: { $ref: "#/components/schemas/EnergyMeasure" }
    Subsidy:
      type: object
      required: [code, name, reason, estimatedAmount]
      properties:
        code: { type: string }
        name: { type: string }
        reason: { type: string }
        estimatedAmount: { type: number }
    NetRoi:
      type: object
      required: [totalInvestment, valueCreation, netRoi, revisedValue]
      properties:
        totalInvestment: { type: number }
        valueCreation: { type: number }
        netRoi: { type: number }
        revisedValue: { type: number }
    DealDetailResponse:
      type: object
      required: [deal, energy, subsidies, netRoi]
      properties:
        deal: { $ref: "#/components/schemas/DealRecord" }
        energy: { $ref: "#/components/schemas/EnergyAnalysis" }
        subsidies:
          type: object
          required: [triggers, totalEstimatedAmount]
          properties:
            triggers:
              type: array
              items: { $ref: "#/components/schemas/Subsidy" }
            totalEstimatedAmount: { type: number }
        netRoi: { $ref: "#/components/schemas/NetRoi" }
    EnergyResponse:
      type: object
      required: [energy, subsidies, netRoi]
      properties:
        energy: { $ref: "#/components/schemas/EnergyAnalysis" }
        subsidies:
          type: object
          required: [triggers, totalEstimatedAmount]
          properties:
            triggers:
              type: array
              items: { $ref: "#/components/schemas/Subsidy" }
            totalEstimatedAmount: { type: number }
        netRoi: { $ref: "#/components/schemas/NetRoi" }
    InvestorInput:
      type: object
      required: [name, email, budgetMin, budgetMax]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        company: { type: string }
        riskProfile: { type: string, enum: [LOW, MEDIUM, HIGH] }
        budgetMin: { type: number, minimum: 0 }
        budgetMax: { type: number, minimum: 0 }
        preferredRegions: { type: array, items: { type: string } }
        interests: { type: array, items: { type: string } }
    InvestorRecord:
      allOf:
        - $ref: "#/components/schemas/InvestorInput"
        - type: object
          required: [investorId, riskProfile, preferredRegions, interests, ownerId, createdAt, updatedAt]
          properties:
            investorId: { type: string }
            riskProfile: { type: string, enum: [LOW, MEDIUM, HIGH] }
            preferredRegions: { type: array, items: { type: string } }
            interests: { type: array, items: { type: string } }
            ownerId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    InvestorMatch:
      allOf:
        - $ref: "#/components/schemas/InvestorRecord"
        - type: object
          required: [matchScore, reasons]
          properties:
            matchScore: { type: number }
            reasons: { type: array, items: { type: string } }
    CrmContactInput:
      type: object
      required: [type, name]
      properties:
        type: { type: string, enum: [INVESTOR, MAKELAAR, PARTNER] }
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: string }
        company: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        notes: { type: string }
    CrmContactRecord:
      allOf:
        - $ref: "#/components/schemas/CrmContactInput"
        - type: object
          required: [contactId, status, ownerId, createdAt, updatedAt]
          properties:
            contactId: { type: string }
            status: { type: string, enum: [ACTIVE, INACTIVE] }
            ownerId: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CrmActivityInput:
      type: object
      required: [kind, summary]
      properties:
        kind: { type: string, enum: [NOTE, CALL, EMAIL, MEETING] }
        summary: { type: string, minLength: 1 }
        occurredAt: { type: string, format: date-time }
    CrmActivityRecord:
      allOf:
        - $ref: "#/components/schemas/CrmActivityInput"
        - type: object
          required: [activityId, contactId, actorId, ownerId, createdAt]
          properties:
            activityId: { type: string }
            contactId: { type: string }
            actorId: { type: string }
            ownerId: { type: string }
            createdAt: { type: string, format: date-time }
    EnterpriseOverview:
      type: object
      required: [status, tenantId, counts, goDeals, averageDealScore, lastUpdated]
      properties:
        status: { type: string }
        tenantId: { type: string }
        counts:
          type: object
          required: [deals, investors, crmContacts]
          properties:
            deals: { type: integer }
            investors: { type: integer }
            crmContacts: { type: integer }
        goDeals: { type: integer }
        averageDealScore: { type: number }
        lastUpdated: { type: string, format: date-time }
    SaasEntitlements:
      type: object
      required: [tier, label, maxProperties, maxInvestors, features]
      properties:
        tier: { type: string, enum: [STARTER, PROFESSIONAL, INVESTOR, ENTERPRISE] }
        label: { type: string }
        maxProperties: { type: number }
        maxInvestors: { type: number }
        features: { type: array, items: { type: string } }
    BillingReadiness:
      type: object
      required: [provider, configured, webhookReady, supportedTiers, message]
      properties:
        provider: { type: string, enum: [stripe, whop, unconfigured] }
        configured: { type: boolean }
        webhookReady: { type: boolean }
        supportedTiers: { type: array, items: { type: string } }
        message: { type: string }
    GutFeelingSignal:
      type: object
      required: [score, confidence, summary, sourceCount, region, observedAt, staleAt]
      properties:
        score: { type: number, minimum: 0, maximum: 100 }
        confidence: { type: number, minimum: 0, maximum: 100 }
        summary: { type: string }
        sourceCount: { type: integer, minimum: 0 }
        region: { type: string }
        observedAt: { type: string, format: date-time }
        staleAt: { type: string, format: date-time }
    TrainingScenarioInput:
      type: object
      required: [propertyId, title, region, askingPrice, expectedValue]
      properties:
        propertyId: { type: string, minLength: 1 }
        title: { type: string, minLength: 1, maxLength: 160 }
        region: { type: string, minLength: 1, maxLength: 120 }
        askingPrice: { type: number, minimum: 1 }
        renovationCost: { type: number, minimum: 0 }
        expectedValue: { type: number, minimum: 1 }
        monthlyRent: { type: number, minimum: 0 }
        municipality: { type: string, maxLength: 120 }
    TrainingScenarioUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        region: { type: string, minLength: 1, maxLength: 120 }
        askingPrice: { type: number, minimum: 1 }
        renovationCost: { type: number, minimum: 0 }
        expectedValue: { type: number, minimum: 1 }
        monthlyRent: { type: number, minimum: 0 }
        municipality: { type: string, maxLength: 120 }
    TrainingScenario:
      type: object
      required: [scenarioId, propertyId, title, region, propertyType, energyLabel, woonoppervlak, askingPrice, renovationCost, expectedValue, monthlyRent, status, qualityGatePassed, score, ownerId, createdAt, updatedAt]
      properties:
        scenarioId: { type: string }
        propertyId: { type: string }
        title: { type: string }
        region: { type: string }
        propertyType: { type: string }
        energyLabel: { type: string }
        woonoppervlak: { type: number }
        askingPrice: { type: number }
        renovationCost: { type: number }
        expectedValue: { type: number }
        monthlyRent: { type: number }
        municipality: { type: ["string", "null"] }
        status: { type: string, enum: [DRAFT, READY, PROMOTED] }
        qualityGatePassed: { type: boolean }
        score: { $ref: "#/components/schemas/DealScore" }
        gutFeeling: { oneOf: [{ $ref: "#/components/schemas/NeighborhoodSentimentSnapshot" }, { type: "null" }] }
        promotedDealId: { type: ["string", "null"] }
        ownerId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TrainingPromotionResponse:
      type: object
      required: [scenario, deal, investorReadySheetUrl]
      properties:
        scenario: { $ref: "#/components/schemas/TrainingScenario" }
        deal: { $ref: "#/components/schemas/DealRecord" }
        investorReadySheetUrl: { type: string }
    TrainingSentimentResponse:
      type: object
      required: [scenario, sentiment]
      properties:
        scenario: { $ref: "#/components/schemas/TrainingScenario" }
        sentiment: { $ref: "#/components/schemas/NeighborhoodSentimentSnapshot" }
    VisitorIntentEventInput:
      type: object
      required: [visitorId, eventType, dealId, consent]
      properties:
        visitorId: { type: string, minLength: 8, maxLength: 128, pattern: "^[A-Za-z0-9_-]{8,128}$" }
        eventType: { type: string, enum: [DEAL_VIEW, ROI_CALCULATOR, SUBSIDY_CALCULATOR, PDF_DOWNLOAD] }
        dealId: { type: string, minLength: 1 }
        investorId: { type: string, minLength: 1 }
        consent: { type: boolean, const: true }
    VisitorIntentEvent:
      type: object
      required: [eventId, visitorId, eventType, occurredAt]
      properties:
        eventId: { type: string }
        visitorId: { type: string }
        eventType: { type: string, enum: [DEAL_VIEW, ROI_CALCULATOR, SUBSIDY_CALCULATOR, PDF_DOWNLOAD] }
        dealId: { type: ["string", "null"] }
        investorId: { type: ["string", "null"] }
        occurredAt: { type: string, format: date-time }
    VisitorLeadScore:
      type: object
      required: [visitorId, score, intentLevel, eventCount, lastSeen, viewedDealIds]
      properties:
        visitorId: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        intentLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        eventCount: { type: integer, minimum: 0 }
        lastSeen: { type: string, format: date-time }
        viewedDealIds: { type: array, items: { type: string } }
    VisitorIntentSummary:
      type: object
      required: [asOf, windowDays, eventsCount, uniqueVisitors, uniqueInvestors, leads, interactionCounts]
      properties:
        asOf: { type: string, format: date-time }
        windowDays: { type: integer }
        eventsCount: { type: integer }
        uniqueVisitors: { type: integer }
        uniqueInvestors: { type: integer }
        leads:
          type: array
          items: { $ref: "#/components/schemas/VisitorLeadScore" }
        interactionCounts:
          type: object
          additionalProperties: { type: integer }
    DealSalesIntelligence:
      type: object
      required: [dealId, windowHours, uniqueVisitors, uniqueInvestors, dealViews, roiCalculatorInteractions, subsidyCalculatorInteractions, pdfDownloads, highIntentCount, urgencyLevel, investorViewText]
      properties:
        dealId: { type: string }
        windowHours: { type: integer }
        uniqueVisitors: { type: integer }
        uniqueInvestors: { type: integer }
        dealViews: { type: integer }
        roiCalculatorInteractions: { type: integer }
        subsidyCalculatorInteractions: { type: integer }
        pdfDownloads: { type: integer }
        highIntentCount: { type: integer }
        urgencyLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        investorViewText: { type: string }
    DailyMarketPulseItem:
      type: object
      required: [rank, dealId, title, region, netRoi, totalScore, decision, investorMatchCount, explanation]
      properties:
        rank: { type: integer, minimum: 1, maximum: 3 }
        dealId: { type: string }
        title: { type: string }
        region: { type: string }
        netRoi: { type: number }
        totalScore: { type: number }
        decision: { type: string, enum: [GO, HOLD, REJECT] }
        investorMatchCount: { type: integer }
        explanation: { type: string }
    DailyMarketPulse:
      type: object
      required: [generatedAt, ranking, availableDealsCount, items]
      properties:
        generatedAt: { type: string, format: date-time }
        ranking: { type: string, const: netRoi-desc-score-desc }
        availableDealsCount: { type: integer }
        items:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/DailyMarketPulseItem" }
    RecommendedDeal:
      type: object
      required: [dealId, title, region, askingPrice, expectedValue, totalScore, matchScore, reasons]
      properties:
        dealId: { type: string }
        title: { type: string }
        region: { type: string }
        askingPrice: { type: number }
        expectedValue: { type: number }
        totalScore: { type: number }
        matchScore: { type: number }
        reasons: { type: array, items: { type: string } }
    InvestorRecommendations:
      type: object
      required: [greeting, investor, recommendations]
      properties:
        greeting: { type: string }
        investor: { $ref: "#/components/schemas/InvestorRecord" }
        recommendations:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/RecommendedDeal" }
    SentimentArticle:
      type: object
      required: [articleId, title, url, source, publishedAt, summary, sentimentScore, topics, imageUrl]
      properties:
        articleId: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        source: { type: string }
        publishedAt: { type: ["string", "null"], format: date-time }
        summary: { type: string }
        sentimentScore: { type: number, minimum: -1, maximum: 1 }
        topics: { type: array, items: { type: string } }
        imageUrl: { type: ["string", "null"], format: uri }
    NeighborhoodTrend:
      type: object
      required: [topic, articleCount, deltaPercent, direction]
      properties:
        topic: { type: string }
        articleCount: { type: integer, minimum: 0 }
        deltaPercent: { type: number }
        direction: { type: string, enum: [RISING, STABLE, COOLING, NEW] }
    NeighborhoodSentimentSnapshot:
      type: object
      required: [snapshotId, region, sentimentScore, gutFeelingScore, confidence, articleCount, sampledAt, staleAt, source, narrativeTitle, narrativeSummary, scoreExplanation, articles, trends]
      properties:
        snapshotId: { type: string }
