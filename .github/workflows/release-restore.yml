name: Release restore verification

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: realestatex_source
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d realestatex_source"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/realestatex_source
      RESTORE_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      REALESTATEX_BACKUP_DIR: ${{ runner.temp }}/realestatex-backups
      REALESTATEX_STORAGE_PATH: ${{ github.workspace }}/artifacts/api-server/storage/realestateX

    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply schema
        run: pnpm --filter @workspace/db run push

      - name: Import release fixture
        run: pnpm --filter @workspace/scripts run realestatex:migrate

      - name: Create newest backup
        run: pnpm --filter @workspace/scripts run realestatex:backup

      - name: Restore and validate in disposable database
        run: pnpm --filter @workspace/scripts run realestatex:release-restore-test
